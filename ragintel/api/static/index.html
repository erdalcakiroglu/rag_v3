<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ragintel — Doküman Asistanı</title>
<style>
  :root { --bg:#0f1419; --panel:#1a222c; --line:#2a3542; --txt:#e6edf3; --mut:#9fb0c0;
          --acc:#4a9eff; --hi:#2ea043; --me:#d29922; --lo:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); font-weight:600; }
  header small { color:var(--mut); font-weight:400; margin-left:8px; }
  main { max-width:900px; margin:0 auto; padding:20px; }
  .ask { display:flex; gap:8px; }
  .ask input { flex:1; padding:12px 14px; background:var(--panel); border:1px solid var(--line);
               border-radius:8px; color:var(--txt); font-size:15px; }
  .ask button { padding:12px 20px; background:var(--acc); color:#fff; border:0; border-radius:8px;
                font-weight:600; cursor:pointer; }
  .ask button:disabled { opacity:.5; cursor:wait; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin-top:18px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; }
  .b-high{background:rgba(46,160,67,.18);color:var(--hi)} .b-medium{background:rgba(210,153,34,.18);color:var(--me)}
  .b-low{background:rgba(248,81,73,.18);color:var(--lo)}
  .answer { margin:12px 0; white-space:pre-wrap; }
  .answer code{background:#0d1117;padding:1px 5px;border-radius:4px}
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:16px 0 8px; }
  .src { border-left:3px solid var(--acc); padding:6px 10px; margin:6px 0; cursor:pointer; border-radius:0 6px 6px 0;
         background:#0d1117; }
  .src:hover{background:#131c26} .src .q{display:none;color:var(--mut);font-style:italic;margin-top:6px}
  .src.open .q{display:block}
  .src.reviewed{border-left-color:var(--mut);cursor:default;opacity:.85;font-size:13px}
  .reviewed-h{color:var(--mut)} .reviewed-h .muted{font-weight:400;font-size:12px;opacity:.8}
  .chips{display:flex;flex-wrap:wrap;gap:8px} .chip{background:#0d1117;border:1px solid var(--line);
         border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--acc)}
  .chip:hover{border-color:var(--acc)}
  .fb{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--mut);font-size:13px}
  .fb button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:15px}
  .fb button.on{border-color:var(--acc);background:rgba(74,158,255,.12)}
  .meta{color:var(--mut);font-size:12px;margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
  .warn{background:rgba(210,153,34,.14);border:1px solid var(--me);color:var(--me);padding:8px 12px;border-radius:8px;margin-top:12px;font-size:13px}
  .err{color:var(--lo)}
  /* M-2 — yapısal tablo gösterimi */
  .tbtn{margin-top:8px;background:transparent;border:1px solid var(--acc);color:var(--acc);
        border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .tbtn:hover{background:rgba(74,158,255,.12)}
  .twrap{overflow:auto;border:1px solid var(--line);border-radius:6px;margin:6px 0;max-height:420px}
  /* width:max-content + hücre sarması: TEK bir uzun hücre ilk kolonu şişirip
     alıntının geldiği sağdaki kolonları ekran dışına itmesin. */
  table.dt{border-collapse:collapse;width:max-content;min-width:100%;font-size:12.5px}
  table.dt th,table.dt td{border:1px solid var(--line);padding:5px 7px;text-align:left;
        max-width:180px;white-space:normal;overflow-wrap:anywhere;vertical-align:top}
  table.dt th{background:#0d1117;color:var(--mut);font-weight:600;position:sticky;top:0}
  table.dt tr.hl td{background:rgba(74,158,255,.16);border-color:rgba(74,158,255,.5)}
  .tmut{color:var(--mut);font-size:11.5px;margin:4px 0}
  /* M-7: kaynağın sayfasındaki görseller */
  .figbox{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
  .fig{margin:0;border:1px solid var(--line);border-radius:6px;padding:6px;background:#0d1117;max-width:300px}
  .fig img{display:block;max-width:100%;height:auto;border-radius:4px}
  .fig figcaption{color:var(--mut);font-size:11px;margin-top:5px;overflow-wrap:anywhere}
  /* M-12 — giriş/kayıt ekranı + hesap alanı */
  .acct{float:right;font-weight:400;font-size:13px;color:var(--mut)}
  .acct button{color:var(--acc);cursor:pointer;background:none;border:none;font-size:13px;padding:0}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .overlay.hidden{display:none}
  .authbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:370px;max-width:94vw}
  .authbox h2{margin:0 0 4px;font-size:19px} .authbox .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
  .authtabs{display:flex;gap:8px;margin-bottom:16px}
  .authtabs button{flex:1;padding:9px;border:1px solid var(--line);background:#0d1117;color:var(--txt);border-radius:8px;cursor:pointer;font-size:14px}
  .authtabs button.on{border-color:var(--acc);color:var(--acc)}
  .authbox label{display:block;font-size:12px;color:var(--mut);margin:11px 0 4px}
  .authbox input{width:100%;padding:10px 12px;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:14px}
  .authbox .go{width:100%;margin-top:18px;padding:11px;background:var(--acc);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer}
  .authbox .go:disabled{opacity:.5;cursor:wait}
  .authmsg{margin-top:12px;font-size:13px;white-space:pre-wrap} .authmsg.err{color:var(--lo)} .authmsg.ok{color:var(--hi)}
  .authalt{margin-top:16px;text-align:center;font-size:12px}
  .authalt button{color:var(--mut);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:12px}
  /* M-13 — sohbet paneli (sol liste + mesaj akışı) */
  .sbtoggle{background:none;border:none;color:var(--mut);cursor:pointer;font-size:18px;margin-right:10px;vertical-align:middle}
  .layout{display:flex;align-items:flex-start}
  #sidebar{position:sticky;top:0;height:100vh;width:264px;flex:0 0 264px;border-right:1px solid var(--line);
           background:#12181f;display:flex;flex-direction:column;overflow:hidden}
  #sidebar.hidden{display:none}
  .sb-head{padding:12px}
  #newchat{width:100%;padding:10px;background:var(--acc);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer}
  #convlist{flex:1;overflow:auto;padding:0 8px 12px}
  .conv{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
  .conv:hover{background:#1a222c} .conv.on{background:#1f2a36}
  .conv .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .del{opacity:0;border:none;background:none;color:var(--mut);cursor:pointer;font-size:14px;padding:0 2px}
  .conv:hover .del{opacity:1} .conv .del:hover{color:var(--lo)}
  .sb-empty{color:var(--mut);font-size:12.5px;padding:10px 12px}
  main{flex:1;min-width:0}
  #out{max-width:900px;margin:0 auto}
  .msg{max-width:900px;margin:14px auto 0;padding:11px 16px;border-radius:10px;white-space:pre-wrap;line-height:1.5}
  .msg.user{background:#1f2a36;border:1px solid var(--line)}
  .msg.asst{background:var(--panel);border:1px solid var(--line)}
  .msg .role{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
</style>
</head>
<body>
<header><button class="sbtoggle" onclick="toggleSidebar()" title="Sohbetler">☰</button>ragintel <small>kurumsal doküman asistanı — FAZ 7 öncü</small><span class="acct" id="acct"></span></header>

<!-- M-12: giriş/kayıt ekranı (token yoksa açılır). Token-yapıştırma yolu altta gizli tutulur. -->
<div id="auth" class="overlay hidden">
  <div class="authbox">
    <h2>ragintel</h2><div class="sub">Kurumsal doküman asistanı — devam etmek için giriş yapın</div>
    <div class="authtabs">
      <button id="tab-login" class="on" onclick="authTab('login')">Giriş</button>
      <button id="tab-reg" onclick="authTab('register')">Kayıt Ol</button>
    </div>
    <div id="pane-login">
      <label>Email</label><input id="li_email" type="email" autocomplete="username">
      <label>Şifre</label><input id="li_pw" type="password" autocomplete="current-password">
      <button class="go" id="li_go" onclick="doLogin()">Giriş yap</button>
    </div>
    <div id="pane-register" style="display:none">
      <label>Ad Soyad</label><input id="rg_name" autocomplete="name">
      <label>Email</label><input id="rg_email" type="email" autocomplete="username">
      <label>Şifre</label><input id="rg_pw" type="password" autocomplete="new-password">
      <button class="go" id="rg_go" onclick="doRegister()">Kayıt ol</button>
    </div>
    <div id="authmsg" class="authmsg"></div>
    <div class="authalt"><button onclick="tokenLogin()">Token ile giriş (yönetici / servis)</button></div>
  </div>
</div>

<div class="layout">
  <!-- M-13: sohbet listesi (sol panel) -->
  <aside id="sidebar">
    <div class="sb-head"><button id="newchat" onclick="newChat()">＋ Yeni sohbet</button></div>
    <div id="convlist"></div>
  </aside>
  <main>
    <form class="ask" id="askForm">
      <input id="q" placeholder="Sorunuzu yazın… (ör. Karbon vergisini ilk uygulayan ülke hangisidir?)" autocomplete="off">
      <button id="askBtn" type="submit">Sor</button>
    </form>
    <div id="out"></div>
  </main>
</div>
<script>
const out = document.getElementById('out'), qEl = document.getElementById('q'), btn = document.getElementById('askBtn');
let sessionId = localStorage.getItem('ragintel_session') || null;
let cardSeq = 0;   // M-13: her yanıt kartına benzersiz ön-ek (kaynak/tablo id çakışması olmasın)
const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const scrollBottom = () => window.scrollTo(0, document.body.scrollHeight);

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');}

document.getElementById('askForm').addEventListener('submit', e=>{ e.preventDefault(); ask(qEl.value); });

// FAZ 6: Bearer token (localStorage). API fail-closed → token zorunlu.
function authHeaders(){
  const h={'Content-Type':'application/json'};
  const t=localStorage.getItem('ragintel_token');
  if(t) h['Authorization']='Bearer '+t;
  return h;
}
function promptToken(){
  const t=prompt('API token (Authorization: Bearer). Yöneticinizden alın:');
  if(t && t.trim()){ localStorage.setItem('ragintel_token', t.trim()); return true; }
  return false;
}

// ---- M-12: email+şifre giriş/kayıt (FAZ 6 Bearer'ın üstünde) ---------------
function authTab(which){
  document.getElementById('pane-login').style.display = which==='login'?'block':'none';
  document.getElementById('pane-register').style.display = which==='register'?'block':'none';
  document.getElementById('tab-login').classList.toggle('on', which==='login');
  document.getElementById('tab-reg').classList.toggle('on', which==='register');
  authMsg('');
}
function authMsg(t, ok){ const m=document.getElementById('authmsg'); m.textContent=t||''; m.className='authmsg'+(t?(ok?' ok':' err'):''); }
function showAuth(show){ document.getElementById('auth').classList.toggle('hidden', !show); }
function renderAcct(){
  const uid=localStorage.getItem('ragintel_user'); const a=document.getElementById('acct');
  a.innerHTML = uid ? `${esc(uid)} · <button onclick="logout()">çıkış</button>`
                    : `<button onclick="showAuth(true)">Giriş</button>`;
}
async function doLogin(){
  const email=document.getElementById('li_email').value.trim(), pw=document.getElementById('li_pw').value;
  if(!email||!pw){ authMsg('Email ve şifre girin.'); return; }
  const b=document.getElementById('li_go'); b.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email, password:pw})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ authMsg(j.detail||'Giriş başarısız.'); return; }   // 401 nötr / 403 pending·disabled
    localStorage.setItem('ragintel_token', j.token);
    localStorage.setItem('ragintel_user', j.user_id);
    document.getElementById('li_pw').value='';
    authMsg(''); showAuth(false); renderAcct(); loadConversations();
  }catch(e){ authMsg('Ağ hatası — tekrar deneyin.'); }
  finally{ b.disabled=false; }
}
async function doRegister(){
  const full_name=document.getElementById('rg_name').value.trim();
  const email=document.getElementById('rg_email').value.trim(), pw=document.getElementById('rg_pw').value;
  if(!full_name||!email||!pw){ authMsg('Tüm alanları doldurun.'); return; }
  const b=document.getElementById('rg_go'); b.disabled=true;
  try{
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({full_name, email, password:pw})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ authMsg(j.detail||'Kayıt başarısız.'); return; }    // 403 allowlist / 400 politika
    document.getElementById('rg_pw').value='';
    authMsg(j.message||'Kaydınız alındı; yönetici onayından sonra giriş yapabilirsiniz.', true);
  }catch(e){ authMsg('Ağ hatası — tekrar deneyin.'); }
  finally{ b.disabled=false; }
}
async function logout(){
  // Önce sunucudaki oturumu sonlandır (Redis'ten sil), sonra yereli temizle.
  try{ await fetch('/api/logout',{method:'POST',headers:authHeaders()}); }catch(e){}
  localStorage.removeItem('ragintel_token'); localStorage.removeItem('ragintel_user');
  sessionId=null; localStorage.removeItem('ragintel_session');
  out.innerHTML=''; document.getElementById('convlist').innerHTML='';
  renderAcct(); showAuth(true);
}
function tokenLogin(){ if(promptToken()){ localStorage.setItem('ragintel_user','(token)'); showAuth(false); renderAcct(); loadConversations(); } }

// Açılış: hesap alanını çiz; token yoksa giriş ekranını göster, varsa sohbetleri yükle.
renderAcct();
if(!localStorage.getItem('ragintel_token')) showAuth(true); else loadConversations();

async function ask(question){
  question=(question||'').trim(); if(!question) return;
  qEl.value=''; btn.disabled=true; btn.textContent='…';
  out.appendChild(el(`<div class="msg user"><div class="role">Siz</div>${esc(question)}</div>`));
  const card = el('<div class="card">Yanıt hazırlanıyor…</div>'); out.appendChild(card); scrollBottom();
  try{
    const r = await fetch('/api/ask',{method:'POST',headers:authHeaders(),
      body:JSON.stringify({question, session_id:sessionId})});
    if(r.status===401){ // token yok/geçersiz/oturum düşmüş → giriş ekranını aç
      card.className='card err'; card.textContent='Oturum gerekli — lütfen giriş yapın.';
      localStorage.removeItem('ragintel_user'); renderAcct(); showAuth(true); return;
    }
    if(!r.ok){ const t=await r.text(); card.className='card err'; card.textContent=`Hata ${r.status}: ${t}`; return; }
    sessionId = r.headers.get('X-Session-Id') || sessionId;
    if(sessionId) localStorage.setItem('ragintel_session', sessionId);
    const injected = r.headers.get('X-Injection-Flagged')==='1';
    card.innerHTML = answerCardHTML(await r.json(), injected, ++cardSeq);
    loadConversations();   // yeni sohbet / last_at listede yansısın
  }catch(err){ card.className='card err'; card.textContent='Ağ hatası: '+String(err); }
  finally{ btn.disabled=false; btn.textContent='Sor'; scrollBottom(); }
}

// Yanıt kartının İÇ HTML'i (kart konteyneri ask() tarafından). `seq` benzersiz ön-ek:
// aynı akışta birden çok yanıtın tablo/görsel id'leri ÇAKIŞMASIN (M-2/M-7 kapları kart-yerel).
function answerCardHTML(resp, injected, seq){
  const c = resp.confidence||'low';
  const label = {high:'yüksek güven',medium:'orta güven',low:'düşük güven'}[c]||c;
  let h = `<span class="badge b-${c}">${label}</span>`;
  if(injected) h += `<div class="warn">⚠ Soruda şüpheli kalıp işaretlendi (reddedilmedi; kayda geçti).</div>`;
  h += `<div class="answer">${md(resp.answer)}</div>`;
  if(resp.sources && resp.sources.length){
    h += `<h3>Kaynaklar</h3>`;
    resp.sources.forEach(s=>{
      const uid = seq+'_'+s.n;              // kart-yerel benzersiz id
      const loc = s.page!=null ? `s.${s.page}` : '';
      // M-2: yalnızca tablo-kökenli kaynakta düğme + tablo kabı. Diğerleri AYNEN eski görünüm.
      const tr = s.table_ref;
      const btn = tr ? `<button class="tbtn" onclick="showTable('${uid}',${tr.table_id},${num(tr.row_start)},${num(tr.row_end)},event)">Tabloyu görüntüle</button>` : '';
      const box = tr ? `<div id="tbl-${uid}"></div>` : '';
      // M-7: alıntının geldiği SAYFADAKİ görseller.
      const figs = (s.figures && s.figures.length)
        ? `<button class="tbtn" onclick="showFigures('${uid}',event)">Kaynağın görselleri (${s.figures.length})</button>
           <div id="fig-${uid}" class="figbox"></div>` : '';
      h += `<div class="src" onclick="this.classList.toggle('open')"><b>[${s.n}]</b> ${esc(s.file_name)} ${loc}
             ${s.section?('· '+esc(s.section)):''}<div class="q">“${esc(s.quote)}”</div>${btn}${figs}${box}</div>`;
      if(s.figures && s.figures.length) FIGS[uid] = s.figures;
    });
  } else {
    // FAZ 5: reddedilen yanıtta kaynak GÖSTERİLMEZ (citation değil). İncelenen ama cevabı
    // desteklemeyen chunk'lar meta.reviewed_sources'ta — ayrı etiketli, alıntı görünümü DIŞINDA.
    const reviewed = (resp.meta && resp.meta.reviewed_sources) || [];
    if(reviewed.length){
      h += `<div class="warn">Cevap bulunamadı — bu soruyu doğrudan yanıtlayan kaynak yok.</div>`;
      h += `<h3 class="reviewed-h">İncelenen kaynaklar <span class="muted">(cevabı desteklemiyor)</span></h3>`;
      reviewed.forEach(s=>{
        const loc = s.page!=null ? `s.${s.page}` : '';
        h += `<div class="src reviewed">${esc(s.file_name)} ${loc}${s.section?('· '+esc(s.section)):''}</div>`;
      });
    } else {
      h += `<div class="warn">Bu soru için kaynak gösterilemedi — yanıt dürüstçe "bulunamadı".</div>`;
    }
  }
  if(resp.followups && resp.followups.length){
    h += `<h3>Devam soruları</h3><div class="chips">`;
    resp.followups.forEach(f=> h += `<span class="chip" onclick="ask(${JSON.stringify(f).replace(/"/g,'&quot;')})">${esc(f)}</span>`);
    h += `</div>`;
  }
  const tid = (resp.meta&&resp.meta.trace_id)||'';
  h += `<div class="fb"><span>Bu yanıt yardımcı oldu mu?</span>
        <button onclick="feedback(1,'${tid}',this)">👍</button>
        <button onclick="feedback(-1,'${tid}',this)">👎</button><span class="fbmsg"></span></div>`;
  const m = resp.meta||{};
  h += `<div class="meta">tur: ${m.iterations} · token: ${m.tokens} · model: ${esc(m.model||'')} · trace: ${esc((tid||'').slice(0,12))}</div>`;
  return h;
}

// ---- M-2: yapısal tablo gösterimi -----------------------------------------
function num(v){ return (v===null||v===undefined) ? 'null' : Number(v); }

// Tabloyu jsonb'den HTML olarak kurar. rowStart/rowEnd doluysa (M-1 alt-chunk'ı)
// ilgili GÖVDE satırları vurgulanır; boşsa tablonun tamamı sade gösterilir.
function tableHtml(t, rowStart, rowEnd){
  const loc = t.sheet ? ('sayfa: '+esc(t.sheet)) : (t.page!=null ? ('s.'+t.page) : '');
  let h = `<div class="tmut">${esc(t.file_name)} ${loc} · tablo ${t.table_index}`
        + `${t.headerless ? ' · başlıksız (jenerik kolonlar)' : ''} · ${t.row_count} satır</div>`;
  h += `<div class="twrap"><table class="dt"><thead><tr>`;
  t.columns.forEach(c => h += `<th>${esc(c)}</th>`);
  h += `</tr></thead><tbody>`;
  t.rows.forEach((row, i) => {
    const no = i + 1;  // gövde satırı, 1-tabanlı (M-1 satır aralığı ile aynı sayım)
    const hl = (rowStart != null && no >= rowStart && no <= rowEnd) ? ' class="hl"' : '';
    h += `<tr${hl}>` + row.map(c => `<td>${esc(c)}</td>`).join('') + `</tr>`;
  });
  h += `</tbody></table></div>`;
  if(rowStart != null){
    const span = (rowEnd !== rowStart) ? `${rowStart}–${rowEnd}` : `${rowStart}`;
    h += `<div class="tmut">Alıntının geldiği satırlar vurgulandı: gövde satırı ${span}</div>`;
  }
  return h;
}

// ---- M-7: kaynağın sayfasındaki görseller ---------------------------------
// <img src="/api/figure/..."> KULLANILAMAZ: img etiketi Authorization başlığı
// gönderemez, uç ise Bearer istiyor (fail-closed). O yüzden fetch + blob URL.
const FIGS = {};                       // n -> [{figure_id, caption, page}]
async function showFigures(n, ev){
  ev.stopPropagation();
  const box = document.getElementById('fig-'+n);
  if(box.dataset.open === '1'){ box.innerHTML=''; box.dataset.open='0'; _revoke(box); return; }
  box.dataset.open = '1';
  box.innerHTML = '<div class="tmut">Görseller yükleniyor…</div>';
  const figs = FIGS[n] || [];
  const urls = [];
  const parts = await Promise.all(figs.map(async f => {
    try{
      const r = await fetch('/api/figure/'+f.figure_id, {headers: authHeaders()});
      // 404 = yok VEYA scope dışı VEYA görüntü kaydedilmemiş (ayırt edilemez, fail-closed).
      if(!r.ok) return `<div class="tmut">Görsel görüntülenemedi (${r.status}).</div>`;
      const url = URL.createObjectURL(await r.blob());
      urls.push(url);
      const cap = f.caption ? esc(f.caption) : (f.page!=null ? ('s.'+f.page) : '');
      return `<figure class="fig"><img src="${url}" alt="${cap}" loading="lazy">
                ${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
    }catch(e){ return `<div class="tmut">Görsel yüklenemedi.</div>`; }
  }));
  box.innerHTML = parts.join('');
  box._urls = urls;                    // kapanışta serbest bırakılacak
}
function _revoke(box){ (box._urls||[]).forEach(u=>URL.revokeObjectURL(u)); box._urls=[]; }

async function showTable(n, tableId, rowStart, rowEnd, ev){
  ev.stopPropagation();                       // kaynak kartının aç/kapa toggle'ını tetikleme
  const box = document.getElementById('tbl-'+n);
  if(box.dataset.open === '1'){ box.innerHTML=''; box.dataset.open='0'; return; }
  box.dataset.open = '1';
  box.innerHTML = '<div class="tmut">Tablo yükleniyor…</div>';
  try{
    const r = await fetch('/api/table/'+tableId, {headers: authHeaders()});
    if(!r.ok){
      // 404 = yok VEYA scope dışı (fail-closed, ayırt edilemez). Alıntı metni geçerli kalır.
      box.innerHTML = `<div class="tmut">Tablo görüntülenemedi (${r.status}) — yukarıdaki alıntı geçerlidir.</div>`;
      return;
    }
    const t = await r.json();
    if(!t.renderable){
      box.innerHTML = '<div class="tmut">Tablo verisi okunamadı — yukarıdaki alıntı metni geçerlidir.</div>';
      return;
    }
    box.innerHTML = tableHtml(t, rowStart, rowEnd);
  }catch(e){
    box.innerHTML = '<div class="tmut">Tablo yüklenemedi — yukarıdaki alıntı metni geçerlidir.</div>';
  }
}

async function feedback(rating, traceId, btnEl){
  const card = btnEl.closest('.card');                 // geri bildirim KART-YEREL (birden çok yanıt)
  card.querySelectorAll('.fb button').forEach(b=>b.classList.remove('on')); btnEl.classList.add('on');
  const msg = card.querySelector('.fbmsg');
  try{
    const r=await fetch('/api/feedback',{method:'POST',headers:authHeaders(),
      body:JSON.stringify({session_id:sessionId,trace_id:traceId,rating})});
    const j=await r.json();
    msg.textContent = j.recorded ? ' — teşekkürler, kaydedildi' : ` — (${j.status})`;
  }catch(e){ msg.textContent=' — gönderilemedi'; }
}

// ---- M-13: sohbet listesi / yükle / yeni / sil (sol panel) -----------------
async function loadConversations(){
  const lst = document.getElementById('convlist');
  try{
    const r = await fetch('/api/conversations',{headers:authHeaders()});
    if(!r.ok){ return; }
    const {conversations} = await r.json();
    if(!conversations.length){ lst.innerHTML='<div class="sb-empty">Henüz sohbet yok.</div>'; return; }
    lst.innerHTML='';
    conversations.forEach(cv=>{
      const it = el(`<div class="conv ${cv.conversation_id===sessionId?'on':''}"><span class="t" title="${esc(cv.title)}">${esc(cv.title)}</span><button class="del" title="Sil">✕</button></div>`);
      it.querySelector('.t').onclick = ()=>openConversation(cv.conversation_id);
      it.querySelector('.del').onclick = (e)=>{ e.stopPropagation(); delConversation(cv.conversation_id); };
      lst.appendChild(it);
    });
  }catch(e){}
}
async function openConversation(id){
  try{
    const r = await fetch('/api/conversations/'+encodeURIComponent(id),{headers:authHeaders()});
    if(!r.ok){ if(r.status===401) showAuth(true); return; }   // 404 = yok/başkasının (sahiplik)
    const {messages} = await r.json();
    sessionId = id; localStorage.setItem('ragintel_session', id);
    out.innerHTML='';
    // Geçmiş SALT-OKUMA transcript (checkpoint'ten değil, conversation_messages'tan).
    messages.forEach(m=> out.appendChild(el(
      `<div class="msg ${m.role==='user'?'user':'asst'}"><div class="role">${m.role==='user'?'Siz':'Asistan'}</div>${m.role==='user'?esc(m.content):md(m.content)}</div>`)));
    loadConversations(); scrollBottom();
  }catch(e){}
}
function newChat(){ sessionId=null; localStorage.removeItem('ragintel_session'); out.innerHTML=''; loadConversations(); qEl.focus(); }
async function delConversation(id){
  if(!confirm('Bu sohbeti sil?')) return;
  try{ await fetch('/api/conversations/'+encodeURIComponent(id),{method:'DELETE',headers:authHeaders()}); }catch(e){}
  if(id===sessionId){ sessionId=null; localStorage.removeItem('ragintel_session'); out.innerHTML=''; }
  loadConversations();
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('hidden'); }
