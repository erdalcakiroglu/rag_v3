<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ragintel — Doküman Asistanı</title>
<style>
  /* ------------------------------------------------------------------------
     CSS DEĞİŞKENİ DİSİPLİNİ (Önyüz Brief §7): renk/ölçü/tipografi SABİT HEX
     olarak gömülmez, hepsi buradaki değişkenlere bağlanır. Sonraki aşamada
     tema/font tercihi eklemek = bu bloğu override etmek; yeniden yazım yok.
     ------------------------------------------------------------------------ */
  :root {
    /* renk */
    --bg:#0f1419; --bg-sunken:#0d1117; --panel:#1a222c; --panel-2:#1f2a36;
    --line:#2a3542; --line-soft:#222c37;
    --txt:#e6edf3; --txt-answer:#e6ebf5; --mut:#9fb0c0;
    --acc:#4a9eff; --acc-soft:rgba(74,158,255,.12); --acc-mid:rgba(74,158,255,.16);
    --hi:#2ea043; --me:#d29922; --lo:#f85149; --ok:#3fb950;
    --hi-bg:rgba(46,160,67,.18); --me-bg:rgba(210,153,34,.18); --lo-bg:rgba(248,81,73,.18);
    --warn-bg:rgba(210,153,34,.14);
    --shadow:0 8px 28px rgba(0,0,0,.38);
    /* tipografi */
    --font-ui:-apple-system,Segoe UI,Roboto,sans-serif;
    --font-answer:Georgia,"Iowan Old Style","Times New Roman",serif;
    --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
    --fs-ui:15px; --fs-answer:15.5px; --fs-small:13px; --fs-meta:12px;
    --lh-ui:1.55; --lh-answer:1.72;
    /* ölçü */
    --col:720px;          /* mesaj/kart genişliği */
    --measure:640px;      /* cevap sütunu — satır başına ~65-72 karakter */
    --sidebar-w:264px;
    --ta-max:180px;       /* composer max ~8 satır, sonrası kendi içinde kayar */
    --radius:12px; --radius-sm:8px;
    --t-move:240ms;       /* boş→sohbet geçişi (brief: 200-300ms) */
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:var(--fs-ui)/var(--lh-ui) var(--font-ui);
         display:flex; flex-direction:column; overflow:hidden; }
  header { flex:0 0 auto; padding:14px 20px; border-bottom:1px solid var(--line); font-weight:600; }
  header small { color:var(--mut); font-weight:400; margin-left:8px; }

  /* ---- yerleşim: sol panel + tam yükseklik sohbet sütunu ------------------ */
  .layout { flex:1 1 auto; min-height:0; display:flex; align-items:stretch; }
  #sidebar { width:var(--sidebar-w); flex:0 0 var(--sidebar-w); border-right:1px solid var(--line);
             background:var(--panel); display:flex; flex-direction:column; overflow:hidden; }
  #sidebar.hidden { display:none; }
  .sb-head { padding:12px; }
  #newchat { width:100%; padding:10px; background:var(--acc); color:#fff; border:0;
             border-radius:var(--radius-sm); font-weight:600; cursor:pointer; }
  #convlist { flex:1; overflow:auto; padding:0 8px 12px; }
  .conv { display:flex; align-items:center; gap:6px; padding:9px 10px; border-radius:var(--radius-sm);
          cursor:pointer; font-size:13.5px; }
  .conv:hover { background:var(--panel-2); } .conv.on { background:var(--panel-2); }
  .conv .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv .del { opacity:0; border:none; background:none; color:var(--mut); cursor:pointer; font-size:14px; padding:0 2px; }
  .conv:hover .del { opacity:1; } .conv .del:hover { color:var(--lo); }
  .sb-empty { color:var(--mut); font-size:12.5px; padding:10px 12px; }

  main { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  #chatarea { flex:1 1 auto; min-height:0; position:relative; display:flex; }
  /* TEK kaydırma kabı: pencere değil BU kayar (alt-sabit composer'ın şartı). */
  #scroll { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; }
  #out { padding:8px 16px 4px; }
  /* Boş durum: composer dikey ORTADA. `#spacer`ın flex-grow'u 1→0 animasyonuyla
     composer akıcı biçimde alta iner (flex-grow sayısal → geçişi vardır). */
  #spacer { flex:0 1 0; flex-grow:0; transition:flex-grow var(--t-move) ease; }
  main.empty #spacer { flex-grow:1; }
  main.empty #scroll { overflow:hidden; }
  main.empty #jump { display:none; }

  /* ---- composer ----------------------------------------------------------- */
  #composerWrap { flex:0 0 auto; padding:8px 16px 14px; }
  #hello { max-width:var(--col); margin:0 auto 18px; text-align:center;
           opacity:1; max-height:200px; overflow:hidden;
           transition:opacity var(--t-move) ease, max-height var(--t-move) ease, margin var(--t-move) ease; }
  main:not(.empty) #hello { opacity:0; max-height:0; margin-bottom:0; pointer-events:none; }
  #hello h1 { font-size:26px; margin:0 0 8px; font-weight:600; }
  #hello p { color:var(--mut); margin:0; font-size:14px; }
  .composer { max-width:var(--col); margin:0 auto; display:flex; align-items:flex-end; gap:8px;
              background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
              padding:6px 6px 6px 14px; }
  .composer:focus-within { border-color:var(--acc); }
  .composer textarea { flex:1; background:transparent; border:0; outline:none; resize:none;
              color:var(--txt); font:var(--fs-ui)/1.5 var(--font-ui);
              padding:9px 0; max-height:var(--ta-max); overflow-y:auto; }
  .composer textarea:disabled { opacity:.55; }
  .composer button { flex:0 0 auto; padding:10px 18px; background:var(--acc); color:#fff; border:0;
              border-radius:var(--radius-sm); font-weight:600; cursor:pointer; font-size:14px; }
  .composer button.stop { background:transparent; border:1px solid var(--lo); color:var(--lo); }
  .hint { max-width:var(--col); margin:7px auto 0; color:var(--mut); font-size:11.5px; text-align:center; }

  /* ---- yapış-alta düğmesi -------------------------------------------------- */
  .jump { position:absolute; left:50%; transform:translateX(-50%); bottom:14px; z-index:5;
          background:var(--panel-2); border:1px solid var(--line); color:var(--txt);
          border-radius:20px; padding:7px 14px; font-size:12.5px; cursor:pointer; box-shadow:var(--shadow); }
  .jump:hover { border-color:var(--acc); color:var(--acc); }
  .jump.hidden { display:none; }

  /* ---- mesajlar ------------------------------------------------------------ */
  .msg { max-width:var(--col); margin:16px auto 0; padding:12px 16px; border-radius:var(--radius);
         white-space:pre-wrap; line-height:1.5; }
  .msg.user { background:var(--panel-2); border:1px solid var(--line); }
  .msg.asst { background:var(--panel); border:1px solid var(--line); }
  .msg .role { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  .card { max-width:var(--col); margin:16px auto 0; background:var(--panel); border:1px solid var(--line);
          border-radius:var(--radius); padding:20px 22px 18px; }
  .card:last-child { margin-bottom:10px; }
  .badge { display:inline-block; padding:3px 11px; border-radius:20px; font-size:var(--fs-meta);
           font-weight:700; font-family:var(--font-ui); }
  .b-high { background:var(--hi-bg); color:var(--hi); }
  .b-medium { background:var(--me-bg); color:var(--me); }
  .b-low { background:var(--lo-bg); color:var(--lo); }
  /* CEVAP SESİ: serif + dar sütun + yüksek satır aralığı. Rozet/meta/kaynaklar sans kalır. */
  .answer { font-family:var(--font-answer); font-size:var(--fs-answer); line-height:var(--lh-answer);
            color:var(--txt-answer); max-width:var(--measure); margin:16px 0 22px; white-space:pre-wrap; }
  .answer code { font-family:var(--font-mono); font-size:.88em; background:var(--bg-sunken);
                 padding:1px 5px; border-radius:4px; }
  /* Atıf: satır-içi [1] yerine üst-simge çip — okuma akışını bölmez. */
  .cit { font-family:var(--font-ui); font-size:.6em; vertical-align:super; line-height:0;
         background:var(--acc-soft); color:var(--acc); border-radius:6px; padding:2px 5px;
         margin:0 2px; cursor:pointer; text-decoration:none; }
  .cit:hover { background:var(--acc-mid); }
  h3 { font-family:var(--font-ui); font-size:var(--fs-small); text-transform:uppercase;
       letter-spacing:.05em; color:var(--mut); margin:22px 0 10px; }
  .src { font-family:var(--font-ui); font-size:13.5px; border-left:3px solid var(--acc);
         padding:8px 12px; margin:8px 0; cursor:pointer; border-radius:0 6px 6px 0; background:var(--bg-sunken); }
  .src:hover { background:var(--panel-2); }
  .src .q { display:none; color:var(--mut); font-style:italic; margin-top:6px; }
  .src.open .q { display:block; }
  .src.flash { background:var(--acc-soft); border-left-color:var(--acc); }
  .src.reviewed { border-left-color:var(--mut); cursor:default; opacity:.85; font-size:13px; }
  .reviewed-h { color:var(--mut); } .reviewed-h .muted { font-weight:400; font-size:var(--fs-meta); opacity:.8; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:var(--bg-sunken); border:1px solid var(--line); border-radius:16px; padding:7px 13px;
          font-size:var(--fs-small); cursor:pointer; color:var(--acc); }
  .chip:hover { border-color:var(--acc); }
  .fb { display:flex; gap:8px; align-items:center; margin-top:18px; color:var(--mut); font-size:var(--fs-small); }
  .fb button { background:transparent; border:1px solid var(--line); border-radius:6px; padding:4px 10px;
               cursor:pointer; font-size:var(--fs-ui); }
  .fb button.on { border-color:var(--acc); background:var(--acc-soft); }
  .meta { color:var(--mut); font-size:var(--fs-meta); margin-top:14px; border-top:1px solid var(--line); padding-top:9px; }
  .warn { background:var(--warn-bg); border:1px solid var(--me); color:var(--me); padding:9px 12px;
          border-radius:var(--radius-sm); margin-top:14px; font-size:var(--fs-small); }
  .err { color:var(--lo); }
  /* M-2 — yapısal tablo gösterimi */
  .tbtn { margin-top:8px; background:transparent; border:1px solid var(--acc); color:var(--acc);
          border-radius:6px; padding:4px 10px; font-size:var(--fs-meta); cursor:pointer; }
  .tbtn:hover { background:var(--acc-soft); }
  .twrap { overflow:auto; border:1px solid var(--line); border-radius:6px; margin:6px 0; max-height:420px; }
  /* width:max-content + hücre sarması: TEK bir uzun hücre ilk kolonu şişirip
     alıntının geldiği sağdaki kolonları ekran dışına itmesin. */
  table.dt { border-collapse:collapse; width:max-content; min-width:100%; font-size:12.5px; }
  table.dt th, table.dt td { border:1px solid var(--line); padding:5px 7px; text-align:left;
        max-width:180px; white-space:normal; overflow-wrap:anywhere; vertical-align:top; }
  table.dt th { background:var(--bg-sunken); color:var(--mut); font-weight:600; position:sticky; top:0; }
  table.dt tr.hl td { background:var(--acc-mid); border-color:var(--acc); }
  .tmut { color:var(--mut); font-size:11.5px; margin:4px 0; }
  /* M-7: kaynağın sayfasındaki görseller */
  .figbox { display:flex; flex-wrap:wrap; gap:10px; margin:6px 0; }
  .fig { margin:0; border:1px solid var(--line); border-radius:6px; padding:6px; background:var(--bg-sunken); max-width:300px; }
  .fig img { display:block; max-width:100%; height:auto; border-radius:4px; }
  .fig figcaption { color:var(--mut); font-size:11px; margin-top:5px; overflow-wrap:anywhere; }
  /* M-12 — giriş/kayıt ekranı + hesap alanı */
  .acct { float:right; font-weight:400; font-size:var(--fs-small); color:var(--mut); }
  .acct button { color:var(--acc); cursor:pointer; background:none; border:none; font-size:var(--fs-small); padding:0; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:center;
             justify-content:center; z-index:50; padding:16px; }
  .overlay.hidden { display:none; }
  .authbox { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
             padding:24px; width:370px; max-width:94vw; }
  .authbox h2 { margin:0 0 4px; font-size:19px; }
  .authbox .sub { color:var(--mut); font-size:var(--fs-small); margin-bottom:18px; }
  .authtabs { display:flex; gap:8px; margin-bottom:16px; }
  .authtabs button { flex:1; padding:9px; border:1px solid var(--line); background:var(--bg-sunken);
             color:var(--txt); border-radius:var(--radius-sm); cursor:pointer; font-size:14px; }
  .authtabs button.on { border-color:var(--acc); color:var(--acc); }
  .authbox label { display:block; font-size:var(--fs-meta); color:var(--mut); margin:11px 0 4px; }
  .authbox input { width:100%; padding:10px 12px; background:var(--bg-sunken); border:1px solid var(--line);
             border-radius:var(--radius-sm); color:var(--txt); font-size:14px; }
  .authbox .go { width:100%; margin-top:18px; padding:11px; background:var(--acc); color:#fff; border:0;
             border-radius:var(--radius-sm); font-weight:600; cursor:pointer; }
  .authbox .go:disabled { opacity:.5; cursor:wait; }
  .authmsg { margin-top:12px; font-size:var(--fs-small); white-space:pre-wrap; }
  .authmsg.err { color:var(--lo); } .authmsg.ok { color:var(--hi); }
  .authalt { margin-top:16px; text-align:center; font-size:var(--fs-meta); }
  .authalt button { color:var(--mut); cursor:pointer; text-decoration:underline; background:none;
             border:none; font-size:var(--fs-meta); }
  .sbtoggle { background:none; border:none; color:var(--mut); cursor:pointer; font-size:18px;
             margin-right:10px; vertical-align:middle; }
  /* M-15: aşama streaming'i — yanıt beklenirken canlı ilerleme satırları. */
  .prog { font-family:var(--font-ui); font-size:var(--fs-small); color:var(--mut); line-height:1.75; }
  .pstep { display:flex; gap:8px; align-items:baseline; min-width:0; }
  .pstep .pq { color:var(--txt); opacity:.8; min-width:0; overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap; }
  .pstep .pt { margin-left:auto; font-variant-numeric:tabular-nums; opacity:.6; font-size:var(--fs-meta); }
  .pstep.live::before { content:'●'; color:var(--ok); animation:pulse 1.2s ease-in-out infinite; }
  .pstep.done::before { content:'✓'; opacity:.5; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  /* final gelince aşama satırları KAYBOLMAZ, küçülür: tek satırlık özet olarak katlanır. */
  .proglog { margin:0 0 6px; }
  .proglog summary { color:var(--mut); font-size:var(--fs-meta); cursor:pointer; list-style:none; opacity:.75; }
  .proglog summary::-webkit-details-marker { display:none; }
  .proglog summary::before { content:'▸ '; }
  .proglog[open] summary::before { content:'▾ '; }
  .proglog .prog { margin-top:6px; padding-left:4px; }

  /* ---- dar ekran ----------------------------------------------------------- */
  @media (max-width:820px) {
    :root { --sidebar-w:min(300px,84vw); --col:100%; --measure:100%; }
    #sidebar { position:fixed; top:0; bottom:0; left:0; z-index:40; box-shadow:var(--shadow); }
    #out { padding:8px 10px 4px; }
    #composerWrap { padding:6px 10px 10px; }
    .card { padding:16px 14px 14px; }
    .msg { padding:11px 13px; }
    #hello h1 { font-size:21px; }
  }
</style>
</head>
<body>
<header><button class="sbtoggle" onclick="toggleSidebar()" title="Sohbetler">☰</button>ragintel <small>kurumsal doküman asistanı — FAZ 7 öncü</small><span class="acct" id="acct"></span></header>

<!-- M-12: giriş/kayıt ekranı (token yoksa açılır). Token-yapıştırma yolu altta gizli tutulur. -->
<div id="auth" class="overlay hidden">
  <div class="authbox">
    <h2>ragintel</h2><div class="sub">Kurumsal doküman asistanı — devam etmek için giriş yapın</div>
    <div class="authtabs">
      <button id="tab-login" class="on" onclick="authTab('login')">Giriş</button>
      <button id="tab-reg" onclick="authTab('register')">Kayıt Ol</button>
    </div>
    <div id="pane-login">
      <label>Email</label><input id="li_email" type="email" autocomplete="username">
      <label>Şifre</label><input id="li_pw" type="password" autocomplete="current-password">
      <button class="go" id="li_go" onclick="doLogin()">Giriş yap</button>
    </div>
    <div id="pane-register" style="display:none">
      <label>Ad Soyad</label><input id="rg_name" autocomplete="name">
      <label>Email</label><input id="rg_email" type="email" autocomplete="username">
      <label>Şifre</label><input id="rg_pw" type="password" autocomplete="new-password">
      <button class="go" id="rg_go" onclick="doRegister()">Kayıt ol</button>
    </div>
    <div id="authmsg" class="authmsg"></div>
    <div class="authalt"><button onclick="tokenLogin()">Token ile giriş (yönetici / servis)</button></div>
  </div>
</div>

<div class="layout">
  <!-- M-13: sohbet listesi (sol panel) -->
  <aside id="sidebar">
    <div class="sb-head"><button id="newchat" onclick="newChat()">＋ Yeni sohbet</button></div>
    <div id="convlist"></div>
  </aside>
  <!-- İki durum: .empty = composer ortada + karşılama · yoksa = composer altta sabit -->
  <main id="main" class="empty">
    <div id="chatarea">
      <div id="scroll"><div id="out"></div></div>
      <button id="jump" class="jump hidden" onclick="toBottom()">↓ En alta git</button>
    </div>
    <div id="composerWrap">
      <div id="hello">
        <h1>ragintel</h1>
        <p>Kurumsal doküman asistanı — yanıtlar yalnızca belgelerinizden, alıntılı verilir.</p>
      </div>
      <form class="composer" id="askForm">
        <textarea id="q" rows="1" autocomplete="off"
          placeholder="Sorunuzu yazın… (ör. Karbon vergisini ilk uygulayan ülke hangisidir?)"></textarea>
        <button id="askBtn" type="submit">Sor</button>
      </form>
      <div class="hint">Enter gönderir · Shift+Enter yeni satır</div>
    </div>
    <div id="spacer"></div>
  </main>
</div>
<script>
const out = document.getElementById('out'), qEl = document.getElementById('q'), btn = document.getElementById('askBtn');
const mainEl = document.getElementById('main'), scroller = document.getElementById('scroll');
const jumpBtn = document.getElementById('jump'), askForm = document.getElementById('askForm');
let sessionId = localStorage.getItem('ragintel_session') || null;
let cardSeq = 0;   // M-13: her yanıt kartına benzersiz ön-ek (kaynak/tablo id çakışması olmasın)
const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');}
// Atıf işaretleri: satır-içi [1] → üst-simge çip. Metin ÖNCE esc'lenir; çip yalnız
// sayıdan kurulur (model metni etikete dönüşemez). `map` varsa hover'da kaynak adı.
function answerHtml(s, map){
  return md(s).replace(/\[(\d{1,3})\]/g, (m,n)=>
    `<sup class="cit" data-n="${n}"${(map&&map[n])?` title="${esc(map[n])}"`:''}>${n}</sup>`);
}

// ---- durum: boş ↔ sohbet ----------------------------------------------------
// Geçiş TEK YÖNLÜ ve oturum başına bir kez; "Yeni sohbet" boş duruma döndürür.
function setChatState(on){ mainEl.classList.toggle('empty', !on); }

// ---- yapış-alta (stick-to-bottom) -------------------------------------------
// Takip modu varsayılan; kullanıcı yukarı kaydırırsa DURUR (akış devam etse bile
// ekran zıplamaz); en alta dönünce yeniden takip eder.
const BOTTOM_EPS = 40;
let follow = true;
const atBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < BOTTOM_EPS;
function syncJump(){ jumpBtn.classList.toggle('hidden', follow); }
scroller.addEventListener('scroll', ()=>{ follow = atBottom(); syncJump(); }, {passive:true});
function toBottom(){ follow = true; scroller.scrollTop = scroller.scrollHeight; syncJump(); }
function stick(){ if(follow) scroller.scrollTop = scroller.scrollHeight; else syncJump(); }

// ---- composer ---------------------------------------------------------------
let controller = null, busy = false;
function grow(){ qEl.style.height='auto'; qEl.style.height=qEl.scrollHeight+'px'; }  // max-height CSS'te
qEl.addEventListener('input', grow);
qEl.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); askForm.requestSubmit(); }
});
function setBusy(b){
  busy=b; qEl.disabled=b;
  btn.textContent = b ? 'Durdur' : 'Sor';
  btn.classList.toggle('stop', b);
  if(!b){ qEl.focus(); }
}
askForm.addEventListener('submit', e=>{
  e.preventDefault();
  if(busy){ if(controller) controller.abort(); return; }   // iptal YALNIZ istemci-tarafı UX
  ask(qEl.value);
});

// FAZ 6: Bearer token (localStorage). API fail-closed → token zorunlu.
function authHeaders(){
  const h={'Content-Type':'application/json'};
  const t=localStorage.getItem('ragintel_token');
  if(t) h['Authorization']='Bearer '+t;
  return h;
}
function promptToken(){
  const t=prompt('API token (Authorization: Bearer). Yöneticinizden alın:');
  if(t && t.trim()){ localStorage.setItem('ragintel_token', t.trim()); return true; }
  return false;
}

// ---- M-12: email+şifre giriş/kayıt (FAZ 6 Bearer'ın üstünde) ---------------
function authTab(which){
  document.getElementById('pane-login').style.display = which==='login'?'block':'none';
  document.getElementById('pane-register').style.display = which==='register'?'block':'none';
  document.getElementById('tab-login').classList.toggle('on', which==='login');
  document.getElementById('tab-reg').classList.toggle('on', which==='register');
  authMsg('');
}
function authMsg(t, ok){ const m=document.getElementById('authmsg'); m.textContent=t||''; m.className='authmsg'+(t?(ok?' ok':' err'):''); }
function showAuth(show){ document.getElementById('auth').classList.toggle('hidden', !show); }

async function logout(){
  // Önce sunucudaki oturumu sonlandır (Redis'ten sil), sonra yereli temizle.
  try{ await fetch('/api/logout',{method:'POST',headers:authHeaders()}); }catch(e){}
  localStorage.removeItem('ragintel_token'); localStorage.removeItem('ragintel_user');

function tokenLogin(){ if(promptToken()){ localStorage.setItem('ragintel_user','(token)'); showAuth(false); renderAcct(); loadConversations(); } }

// Açılış: hesap alanını çiz; token yoksa giriş ekranını göster, varsa sohbetleri yükle.
renderAcct();
if(window.innerWidth<=820) document.getElementById('sidebar').classList.add('hidden');
if(!localStorage.getItem('ragintel_token')) showAuth(true); else loadConversations();

// M-15 aşama streaming'i. Cevap METNİ akmaz (ajan submit_answer ile teslim eder,
// metin sunucuda compose'da kurulur) — akan şey AŞAMA sinyalidir. Kazanç algılanan
// gecikmede: ilk geri bildirim ~11-21 sn yerine ~0.1 sn.
const STAGE_LABELS={prepare:'Soru hazırlanıyor',agent:'Düşünüyorum',
  validate:'Kaynaklar doğrulanıyor',compose:'Yanıt kuruluyor',fallback:'Yanıt kuruluyor'};
const TOOL_LABELS={search_hybrid:'Belgelerde arıyorum',lookup_document:'Bağlamı genişletiyorum',
  rerank:'Sonuçlar yeniden sıralanıyor',memory_search:'Oturum hafızasına bakılıyor'};

// SSE çözücü: fetch gövdesini kare kare ayrıştırır. EventSource kullanılmıyor —
// Authorization başlığı taşıyamaz ve POST edemez.
async function* sseEvents(body){
  const reader=body.getReader(), dec=new TextDecoder(); let buf='';
  for(;;){
    const {value,done}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const raw=buf.slice(0,i); buf=buf.slice(i+2);
      let ev='message', data='';
      raw.split('\n').forEach(l=>{
        if(l.startsWith('event:')) ev=l.slice(6).trim();
        else if(l.startsWith('data:')) data+=l.slice(5).trim();
      });
      if(data){ try{ yield {event:ev,data:JSON.parse(data)}; }catch(e){} }
    }
  }
}

async function ask(question){
  question=(question||'').trim(); if(!question || busy) return;   // boş/boşluk gönderilmez
  qEl.value=''; grow(); setBusy(true);
  setChatState(true);                                   // ilk soruda composer alta iner
  controller = new AbortController();
  // Optimistik kullanıcı mesajı: istek gitmeden önce listede görünür.
  out.appendChild(el(`<div class="msg user"><div class="role">Siz</div>${esc(question)}</div>`));
  const card=el('<div class="card"><div class="prog"></div></div>'); out.appendChild(card);
  follow=true; toBottom();
  const prog=card.querySelector('.prog');
  // İlerleme satırı DOM API ile kurulur, innerHTML ile DEĞİL: `q` model üretimi metindir.
  const step=(label,q,t_ms)=>{
    prog.querySelectorAll('.pstep.live').forEach(n=>n.className='pstep done');
    const d=document.createElement('div'); d.className='pstep live';
    const s=document.createElement('span'); s.textContent=label; d.appendChild(s);
    if(q){ const e=document.createElement('span'); e.className='pq'; e.textContent='“'+q+'”'; d.appendChild(e); }
    const t=document.createElement('span'); t.className='pt';
    t.textContent=((t_ms||0)/1000).toFixed(1)+'s'; d.appendChild(t);
    prog.appendChild(d); stick();
  };
  try{
    const r=await fetch('/api/ask/stream',{method:'POST',headers:authHeaders(),signal:controller.signal,
      body:JSON.stringify({question, session_id:sessionId})});
    if(r.status===401){ // token yok/geçersiz/oturum düşmüş → giriş ekranını aç
      card.className='card err'; card.textContent='Oturum gerekli — lütfen giriş yapın.';
      localStorage.removeItem('ragintel_user'); renderAcct(); showAuth(true); return;
    }
    // Akış ucu yok (eski sürüm) ya da gövde okunamıyor → bloklayan /api/ask'a düş.
    if(r.status===404 || !r.body){ return await askBlocking(question, card); }
    if(!r.ok){ const t=await r.text(); card.className='card err'; card.textContent=`Hata ${r.status}: ${t}`; return; }
    sessionId=r.headers.get('X-Session-Id')||sessionId;
    if(sessionId) localStorage.setItem('ragintel_session', sessionId);
    const injected=r.headers.get('X-Injection-Flagged')==='1';
    let final=null, streamErr=null;
    for await(const ev of sseEvents(r.body)){
      const d=ev.data||{};
      if(ev.event==='step') step(STAGE_LABELS[d.stage]||d.stage,null,d.t_ms);
      else if(ev.event==='tool') (d.calls||[]).forEach(c=>
        step(TOOL_LABELS[c.name]||c.name, c.query||null, d.t_ms));
      else if(ev.event==='retrieved') step(d.total+' kaynak bulundu',null,d.t_ms);
      else if(ev.event==='final') final=d;
      else if(ev.event==='error') streamErr=d.message||'bilinmeyen';
    }
    if(!final){ card.className='card err';
      card.textContent='Yanıt akışı yarıda kesildi'+(streamErr?' ('+streamErr+')':'')+'.'; return; }
    const log=collapseProgress(prog);
    card.innerHTML=answerCardHTML(final, injected, ++cardSeq);
    if(log) card.insertBefore(log, card.firstChild);   // aşamalar kaybolmaz, katlanır
    loadConversations();   // yeni sohbet / last_at listede yansısın
  }catch(err){
    card.className='card err';
    card.textContent = (err && err.name==='AbortError') ? 'Durduruldu.' : 'Ağ hatası: '+String(err);
  }
  finally{ controller=null; setBusy(false); stick(); }
}

// `final` gelince ilerleme satırları silinmez: tek satırlık özet altında katlanır.
// Düğümler zaten textContent ile kurulmuştu; klonlanırken de öyle kalır.
function collapseProgress(prog){
  const steps=prog.querySelectorAll('.pstep');
  if(!steps.length) return null;
  prog.querySelectorAll('.pstep.live').forEach(n=>n.className='pstep done');
  const last=steps[steps.length-1].querySelector('.pt');
  const det=document.createElement('details'); det.className='proglog';
  const sum=document.createElement('summary');
  sum.textContent = steps.length+' aşama'+(last?(' · '+last.textContent):'');
  det.appendChild(sum); det.appendChild(prog.cloneNode(true));
  return det;
}

// Akış kullanılamadığında eski (bloklayan) yol — davranış birebir korunur.
async function askBlocking(question, card){
  card.textContent='Yanıt hazırlanıyor…';
  const r=await fetch('/api/ask',{method:'POST',headers:authHeaders(),
    signal:controller?controller.signal:undefined,
    body:JSON.stringify({question, session_id:sessionId})});
  if(r.status===401){ card.className='card err'; card.textContent='Oturum gerekli — lütfen giriş yapın.';
    localStorage.removeItem('ragintel_user'); renderAcct(); showAuth(true); return; }
  if(!r.ok){ const t=await r.text(); card.className='card err'; card.textContent=`Hata ${r.status}: ${t}`; return; }
  sessionId=r.headers.get('X-Session-Id')||sessionId;
  if(sessionId) localStorage.setItem('ragintel_session', sessionId);
  card.innerHTML=answerCardHTML(await r.json(), r.headers.get('X-Injection-Flagged')==='1', ++cardSeq);
  loadConversations();
}

// Atıf çipine tıklama: aynı KARTTAKİ kaynağı açar ve vurgular (kart-yerel).
out.addEventListener('click', e=>{
  const c = e.target.closest('.cit'); if(!c) return;
  const card = c.closest('.card'); if(!card) return;
  const src = card.querySelector('.src[data-n="'+c.dataset.n+'"]'); if(!src) return;
  card.querySelectorAll('.src.flash').forEach(n=>n.classList.remove('flash'));
  src.classList.add('open','flash');
  src.scrollIntoView({block:'nearest', behavior:'smooth'});
});

// Yanıt kartının İÇ HTML'i (kart konteyneri ask() tarafından). `seq` benzersiz ön-ek:
// aynı akışta birden çok yanıtın tablo/görsel id'leri ÇAKIŞMASIN (M-2/M-7 kapları kart-yerel).
function answerCardHTML(resp, injected, seq){
  const c = resp.confidence||'low';
  const label = {high:'yüksek güven',medium:'orta güven',low:'düşük güven'}[c]||c;
  let h = `<span class="badge b-${c}">${label}</span>`;
  if(injected) h += `<div class="warn">⚠ Soruda şüpheli kalıp işaretlendi (reddedilmedi; kayda geçti).</div>`;
  // Atıf çiplerinin hover metni için n → "dosya s.X" haritası.
  const smap = {};
  (resp.sources||[]).forEach(s=>{ smap[s.n] = s.file_name + (s.page!=null ? (' s.'+s.page) : ''); });
  h += `<div class="answer">${answerHtml(resp.answer, smap)}</div>`;
  if(resp.sources && resp.sources.length){
    h += `<h3>Kaynaklar</h3>`;
    resp.sources.forEach(s=>{
      const uid = seq+'_'+s.n;              // kart-yerel benzersiz id
      const loc = s.page!=null ? `s.${s.page}` : '';
      // M-2: yalnızca tablo-kökenli kaynakta düğme + tablo kabı. Diğerleri AYNEN eski görünüm.
      const tr = s.table_ref;
      const btn = tr ? `<button class="tbtn" onclick="showTable('${uid}',${tr.table_id},${num(tr.row_start)},${num(tr.row_end)},event)">Tabloyu görüntüle</button>` : '';
      const box = tr ? `<div id="tbl-${uid}"></div>` : '';
      // M-7: alıntının geldiği SAYFADAKİ görseller.
      const figs = (s.figures && s.figures.length)
        ? `<button class="tbtn" onclick="showFigures('${uid}',event)">Kaynağın görselleri (${s.figures.length})</button>
           <div id="fig-${uid}" class="figbox"></div>` : '';
      h += `<div class="src" data-n="${s.n}" onclick="this.classList.toggle('open')"><b>[${s.n}]</b> ${esc(s.file_name)} ${loc}
             ${s.section?('· '+esc(s.section)):''}<div class="q">“${esc(s.quote)}”</div>${btn}${figs}${box}</div>`;
      if(s.figures && s.figures.length) FIGS[uid] = s.figures;
    });
  } else {
    // FAZ 5: reddedilen yanıtta kaynak GÖSTERİLMEZ (citation değil). İncelenen ama cevabı
    // desteklemeyen chunk'lar meta.reviewed_sources'ta — ayrı etiketli, alıntı görünümü DIŞINDA.
    const reviewed = (resp.meta && resp.meta.reviewed_sources) || [];
    if(reviewed.length){
      h += `<div class="warn">Cevap bulunamadı — bu soruyu doğrudan yanıtlayan kaynak yok.</div>`;
      h += `<h3 class="reviewed-h">İncelenen kaynaklar <span class="muted">(cevabı desteklemiyor)</span></h3>`;
      reviewed.forEach(s=>{
        const loc = s.page!=null ? `s.${s.page}` : '';
        h += `<div class="src reviewed">${esc(s.file_name)} ${loc}${s.section?('· '+esc(s.section)):''}</div>`;
      });
    } else {
      h += `<div class="warn">Bu soru için kaynak gösterilemedi — yanıt dürüstçe "bulunamadı".</div>`;
    }
  }
  if(resp.followups && resp.followups.length){
    h += `<h3>Devam soruları</h3><div class="chips">`;
    resp.followups.forEach(f=> h += `<span class="chip" onclick="ask(${JSON.stringify(f).replace(/"/g,'&quot;')})">${esc(f)}</span>`);
    h += `</div>`;
  }
  const tid = (resp.meta&&resp.meta.trace_id)||'';
  h += `<div class="fb"><span>Bu yanıt yardımcı oldu mu?</span>
        <button onclick="feedback(1,'${tid}',this)">👍</button>
        <button onclick="feedback(-1,'${tid}',this)">👎</button><span class="fbmsg"></span></div>`;
  const m = resp.meta||{};
  h += `<div class="meta">tur: ${m.iterations} · token: ${m.tokens} · model: ${esc(m.model||'')} · trace: ${esc((tid||'').slice(0,12))}</div>`;
  return h;
}

// ---- M-2: yapısal tablo gösterimi -----------------------------------------
function num(v){ return (v===null||v===undefined) ? 'null' : Number(v); }

// Tabloyu jsonb'den HTML olarak kurar. rowStart/rowEnd doluysa (M-1 alt-chunk'ı)
// ilgili GÖVDE satırları vurgulanır; boşsa tablonun tamamı sade gösterilir.
function tableHtml(t, rowStart, rowEnd){
  const loc = t.sheet ? ('sayfa: '+esc(t.sheet)) : (t.page!=null ? ('s.'+t.page) : '');
  let h = `<div class="tmut">${esc(t.file_name)} ${loc} · tablo ${t.table_index}`
        + `${t.headerless ? ' · başlıksız (jenerik kolonlar)' : ''} · ${t.row_count} satır</div>`;
  h += `<div class="twrap"><table class="dt"><thead><tr>`;
  t.columns.forEach(c => h += `<th>${esc(c)}</th>`);
  h += `</tr></thead><tbody>`;
  t.rows.forEach((row, i) => {
    const no = i + 1;  // gövde satırı, 1-tabanlı (M-1 satır aralığı ile aynı sayım)
    const hl = (rowStart != null && no >= rowStart && no <= rowEnd) ? ' class="hl"' : '';
    h += `<tr${hl}>` + row.map(c => `<td>${esc(c)}</td>`).join('') + `</tr>`;
  });
  h += `</tbody></table></div>`;
  if(rowStart != null){
    const span = (rowEnd !== rowStart) ? `${rowStart}–${rowEnd}` : `${rowStart}`;
    h += `<div class="tmut">Alıntının geldiği satırlar vurgulandı: gövde satırı ${span}</div>`;
  }
  return h;
}

// ---- M-7: kaynağın sayfasındaki görseller ---------------------------------
// <img src="/api/figure/..."> KULLANILAMAZ: img etiketi Authorization başlığı
// gönderemez, uç ise Bearer istiyor (fail-closed). O yüzden fetch + blob URL.
const FIGS = {};                       // n -> [{figure_id, caption, page}]
async function showFigures(n, ev){
  ev.stopPropagation();
  const box = document.getElementById('fig-'+n);
  if(box.dataset.open === '1'){ box.innerHTML=''; box.dataset.open='0'; _revoke(box); return; }
  box.dataset.open = '1';
  box.innerHTML = '<div class="tmut">Görseller yükleniyor…</div>';
  const figs = FIGS[n] || [];
  const urls = [];
  const parts = await Promise.all(figs.map(async f => {
    try{
      const r = await fetch('/api/figure/'+f.figure_id, {headers: authHeaders()});
      // 404 = yok VEYA scope dışı VEYA görüntü kaydedilmemiş (ayırt edilemez, fail-closed).
      if(!r.ok) return `<div class="tmut">Görsel görüntülenemedi (${r.status}).</div>`;
      const url = URL.createObjectURL(await r.blob());
      urls.push(url);
      const cap = f.caption ? esc(f.caption) : (f.page!=null ? ('s.'+f.page) : '');
      return `<figure class="fig"><img src="${url}" alt="${cap}" loading="lazy">
                ${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
    }catch(e){ return `<div class="tmut">Görsel yüklenemedi.</div>`; }
  }));
  box.innerHTML = parts.join('');
  box._urls = urls;                    // kapanışta serbest bırakılacak
}
function _revoke(box){ (box._urls||[]).forEach(u=>URL.revokeObjectURL(u)); box._urls=[]; }

async function showTable(n, tableId, rowStart, rowEnd, ev){
  ev.stopPropagation();                       // kaynak kartının aç/kapa toggle'ını tetikleme
  const box = document.getElementById('tbl-'+n);
  if(box.dataset.open === '1'){ box.innerHTML=''; box.dataset.open='0'; return; }
  box.dataset.open = '1';
  box.innerHTML = '<div class="tmut">Tablo yükleniyor…</div>';
  try{
    const r = await fetch('/api/table/'+tableId, {headers: authHeaders()});
    if(!r.ok){
      // 404 = yok VEYA scope dışı (fail-closed, ayırt edilemez). Alıntı metni geçerli kalır.
      box.innerHTML = `<div class="tmut">Tablo görüntülenemedi (${r.status}) — yukarıdaki alıntı geçerlidir.</div>`;
      return;
    }
    const t = await r.json();
    if(!t.renderable){
      box.innerHTML = '<div class="tmut">Tablo verisi okunamadı — yukarıdaki alıntı metni geçerlidir.</div>';
      return;
    }
    box.innerHTML = tableHtml(t, rowStart, rowEnd);
  }catch(e){
    box.innerHTML = '<div class="tmut">Tablo yüklenemedi — yukarıdaki alıntı metni geçerlidir.</div>';
  }
}

async function feedback(rating, traceId, btnEl){
  const card = btnEl.closest('.card');                 // geri bildirim KART-YEREL (birden çok yanıt)
  card.querySelectorAll('.fb button').forEach(b=>b.classList.remove('on')); btnEl.classList.add('on');
  const msg = card.querySelector('.fbmsg');
  try{
    const r=await fetch('/api/feedback',{method:'POST',headers:authHeaders(),
      body:JSON.stringify({session_id:sessionId,trace_id:traceId,rating})});
    const j=await r.json();
    msg.textContent = j.recorded ? ' — teşekkürler, kaydedildi' : ` — (${j.status})`;
  }catch(e){ msg.textContent=' — gönderilemedi'; }
}

// ---- M-13: sohbet listesi / yükle / yeni / sil (sol panel) -----------------
async function loadConversations(){
  const lst = document.getElementById('convlist');
  try{
    const r = await fetch('/api/conversations',{headers:authHeaders()});
    if(!r.ok){ return; }
    const {conversations} = await r.json();
    if(!conversations.length){ lst.innerHTML='<div class="sb-empty">Henüz sohbet yok.</div>'; return; }
    lst.innerHTML='';
    conversations.forEach(cv=>{
      const it = el(`<div class="conv ${cv.conversation_id===sessionId?'on':''}"><span class="t" title="${esc(cv.title)}">${esc(cv.title)}</span><button class="del" title="Sil">✕</button></div>`);
      it.querySelector('.t').onclick = ()=>openConversation(cv.conversation_id);
      it.querySelector('.del').onclick = (e)=>{ e.stopPropagation(); delConversation(cv.conversation_id); };
      lst.appendChild(it);
    });
  }catch(e){}
}
async function openConversation(id){
  try{
    const r = await fetch('/api/conversations/'+encodeURIComponent(id),{headers:authHeaders()});
    if(!r.ok){ if(r.status===401) showAuth(true); return; }   // 404 = yok/başkasının (sahiplik)
    const {messages} = await r.json();
    sessionId = id; localStorage.setItem('ragintel_session', id);
    out.innerHTML='';
    // Geçmiş SALT-OKUMA transcript (checkpoint'ten değil, conversation_messages'tan).
    messages.forEach(m=> out.appendChild(el(
      m.role==='user'
        ? `<div class="msg user"><div class="role">Siz</div>${esc(m.content)}</div>`
        : `<div class="msg asst"><div class="role">Asistan</div><div class="answer">${answerHtml(m.content)}</div></div>`)));
    setChatState(messages.length>0);
    if(window.innerWidth<=820) document.getElementById('sidebar').classList.add('hidden');
    loadConversations(); toBottom();
  }catch(e){}
}
function newChat(){
  sessionId=null; localStorage.removeItem('ragintel_session'); out.innerHTML='';
  setChatState(false); follow=true; syncJump();
  loadConversations(); qEl.focus();
}
async function delConversation(id){
  if(!confirm('Bu sohbeti sil?')) return;
  try{ await fetch('/api/conversations/'+encodeURIComponent(id),{method:'DELETE',headers:authHeaders()}); }catch(e){}
  if(id===sessionId){ sessionId=null; localStorage.removeItem('ragintel_session'); out.innerHTML=''; setChatState(false); }
  loadConversations();
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('hidden'); }
