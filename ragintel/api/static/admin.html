<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ragintel — Admin</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#2f81f7;--ok:#3fb950;--err:#f85149;--warn:#d29922}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,Segoe UI,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:18px;margin:0} .sp{flex:1}
  input,select,textarea,button{font:inherit;background:#0d1117;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
  textarea{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  button{cursor:pointer;background:#21262d} button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .tabs{display:flex;gap:6px;padding:12px 20px 0} .tab{padding:8px 14px;border:1px solid var(--bd);border-bottom:none;border-radius:8px 8px 0 0;background:#0d1117;cursor:pointer}
  .tab.on{background:var(--card);color:var(--acc)}
  main{padding:20px;max-width:1150px} .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
  th{color:var(--mut);font-weight:600} .mut{color:var(--mut)} .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--bd)}
  .s-COMPLETED{color:var(--ok)} .s-FAILED{color:var(--err)} .s-PROCESSING,.s-RETRY,.s-REPROCESS{color:var(--warn)}
  .msg{padding:8px 12px;border-radius:8px;margin:8px 0;font-size:13px}
  .msg.ok{background:rgba(63,185,80,.12);color:var(--ok)} .msg.err{background:rgba(248,81,73,.12);color:var(--err);white-space:pre-wrap}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .hidden{display:none}
  .tok{background:rgba(210,153,34,.14);color:var(--warn);padding:10px;border-radius:8px;font-family:ui-monospace,monospace;word-break:break-all}
  /* --- M-5: şema-güdümlü config formu --- */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .subtab{padding:6px 12px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;font-size:13px}
  .subtab.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .fld{padding:12px 0;border-bottom:1px solid var(--bd)} .fld:last-child{border-bottom:none}
  .fld-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
  .fld-name{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--fg)}
  .fld-help{color:var(--mut);font-size:12.5px;margin-top:6px;max-width:80ch}
  .fld-err{color:var(--err);font-size:12.5px;margin-top:6px;display:none}
  .fld.bad .fld-err{display:block} .fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err)}
  .badge{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid}
  .badge.danger{color:var(--warn);border-color:var(--warn);background:rgba(210,153,34,.12)}
  .badge.diff{color:var(--acc);border-color:var(--acc);background:rgba(47,129,247,.12);cursor:default}
  .badge.saved{color:var(--ok);border-color:var(--ok);background:rgba(63,185,80,.12)}
  .lnk{background:none;border:none;color:var(--acc);padding:0;font-size:12px;text-decoration:underline;cursor:pointer}
  .sect{border:1px solid var(--bd);border-radius:8px;padding:0 12px;margin:10px 0}
  .sect>summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:13.5px}
  .grp-err{color:var(--err);font-size:12.5px;margin:6px 0;display:none} .grp-err.on{display:block}
  input[type=number],input[type=text],select{min-width:220px}
  .listrow{display:flex;gap:6px;margin-bottom:6px} .listrow input{flex:1;font-family:ui-monospace,monospace;font-size:12px}
</style></head>
<body>
<header>
  <h1>ragintel · Admin</h1><span class="pill" id="who">—</span><span class="sp"></span>
  <input id="tok" type="password" placeholder="Admin token (Bearer)" style="width:260px">
  <button onclick="saveTok()">Bağlan</button>
</header>
<div class="tabs">
  <div class="tab on" data-t="config" onclick="tab('config')">Config</div>
  <div class="tab" data-t="users" onclick="tab('users')">Kullanıcılar</div>
  <div class="tab" data-t="docs" onclick="tab('docs')">Doküman & QC</div>
</div>
<main>
  <div id="gate" class="msg err hidden"></div>
  <section id="config"></section>
  <section id="users" class="hidden"></section>
  <section id="docs" class="hidden"></section>
</main>
<script>
const $=s=>document.querySelector(s), el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;};
function tokv(){return localStorage.getItem('ragintel_token')||'';}
function H(){const h={'Content-Type':'application/json'};const t=tokv();if(t)h['Authorization']='Bearer '+t;return h;}
function saveTok(){localStorage.setItem('ragintel_token',$('#tok').value.trim());$('#gate').classList.add('hidden');load();}
async function api(path,opt={}){const r=await fetch(path,{headers:H(),...opt});
  if(r.status===401||r.status===403){gate(r.status);throw new Error(r.status);}
  const j=await r.json().catch(()=>({})); if(!r.ok)throw {status:r.status,body:j}; return j;}
function gate(code){const g=$('#gate');g.textContent=code===403?'Yetkisiz: bu sayfa yalnızca admin kullanıcılar içindir (403).':'Kimlik doğrulama gerekli — geçerli admin token girin (401).';g.classList.remove('hidden');}
function tab(t){['config','users','docs'].forEach(x=>{$('#'+x).classList.toggle('hidden',x!==t);document.querySelector('.tab[data-t='+x+']').classList.toggle('on',x===t);});}
$('#tok').value=tokv();

async function load(){ $('#gate').classList.add('hidden'); try{ await Promise.all([loadConfig(),loadUsers(),loadDocs()]); $('#who').textContent='admin ✓'; }catch(e){} }

// --- 1) CONFIG (M-5: şema-güdümlü, alan-bazlı) ---
// Form pydantic GROUP_MODELS'ten üretilir; burada tip→widget eşlemesi YOK,
// yalnızca şemanın söylediği widget çizilir. Modele alan eklenince otomatik gelir.
let CFG={schema:null,meta:{},cur:{},tab:null};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const getIn=(o,p)=>p.reduce((n,k)=>(n==null?undefined:n[k]),o);

async function loadConfig(){
  const [schema,{groups}]=await Promise.all([api('/api/admin/config/schema'),api('/api/admin/config')]);
  CFG.schema=schema; CFG.meta={}; CFG.cur={};
  groups.forEach(g=>{CFG.meta[g.group]={updated_by:g.updated_by,updated_at:g.updated_at}; CFG.cur[g.group]=g.value||{};});
  CFG.tab=CFG.tab||schema.tabs[0].id;
  renderConfig();
}
function renderConfig(){
  const c=$('#config'); c.innerHTML='';
  const st=el('<div class="subtabs"></div>');
  CFG.schema.tabs.forEach(t=>{
    const b=el(`<div class="subtab ${t.id===CFG.tab?'on':''}">${esc(t.label)}</div>`);
    b.onclick=()=>{CFG.tab=t.id;renderConfig();}; st.appendChild(b);
  });
  c.appendChild(st);
  const tab=CFG.schema.tabs.find(t=>t.id===CFG.tab)||CFG.schema.tabs[0];
  tab.groups.forEach(gname=>c.appendChild(groupCard(CFG.schema.groups[gname])));
}
function groupCard(gs){
  const m=CFG.meta[gs.group]||{};
  const card=el(`<div class="card"><h3>${esc(gs.label)}
      <span class="mut mono" style="font-weight:400;font-size:12px">· ${esc(gs.group)} · ${esc(m.updated_by||'—')} · ${esc((m.updated_at||'').slice(0,19))}</span></h3></div>`);
  const adv=el('<button class="lnk" style="float:right;margin-top:-28px">Gelişmiş (ham JSON)</button>');
  card.appendChild(adv);
  const gerr=el('<div class="grp-err"></div>'); card.appendChild(gerr);
  const form=el('<div></div>');
  gs.fields.forEach(f=>form.appendChild(fieldNode(gs.group,f)));
  card.appendChild(form);
  const raw=rawJsonEditor(gs.group,card); raw.classList.add('hidden'); card.appendChild(raw);
  adv.onclick=()=>{const on=raw.classList.toggle('hidden');form.classList.toggle('hidden',!on);adv.textContent=on?'Gelişmiş (ham JSON)':'Forma dön';};
  card._gerr=gerr;
  return card;
}
function rawJsonEditor(group,card){
  const box=el('<div></div>');
  const ta=el(`<textarea spellcheck="false">${esc(JSON.stringify(CFG.cur[group]||{},null,2))}</textarea>`);
  const btn=el('<div class="row" style="margin-top:8px"><button class="pri">Tüm grubu kaydet (doğrula)</button></div>');
  btn.querySelector('button').onclick=async()=>{
    let v; try{v=JSON.parse(ta.value);}catch(e){return msg(card,'Geçersiz JSON: '+e.message,false);}
    try{
      const r=await api('/api/admin/config/'+group,{method:'POST',body:JSON.stringify(v)});
      msg(card,'Kaydedildi ('+r.updated_by+').',true); await loadConfig();
    }catch(e){ showErrors(card,e); }
  };
  box.append(ta,btn); return box;
}

// --- alan düğümü: etiket + rozetler + widget + TR yardım + hata yuvası ---
function fieldNode(group,f){
  if(f.widget==='section'){
    const d=el(`<details class="sect" open><summary>${esc(f.name)}</summary></details>`);
    if(f.description)d.appendChild(el(`<div class="fld-help" style="margin:0 0 6px">${esc(f.description)}</div>`));
    f.fields.forEach(sub=>d.appendChild(fieldNode(group,sub)));
    return d;
  }
  const key=f.path.join('.');
  const node=el(`<div class="fld" data-f="${esc(key)}"></div>`);
  const head=el(`<div class="fld-head"><span class="fld-name">${esc(f.name)}</span></div>`);
  if(f.danger)head.appendChild(el(`<span class="badge danger" title="Bu alanı değiştirmek mevcut veriyi geçersizleştirir">⚠ ${esc(f.danger)}</span>`));
  const diff=el('<span class="badge diff hidden">varsayılandan farklı</span>');
  const reset=el('<button class="lnk hidden">varsayılana dön</button>');
  head.append(diff,reset); node.appendChild(head);

  const val=getIn(CFG.cur[group],f.path);
  const cur=(val===undefined?f.default:val);
  const ctl=widget(f,cur,v=>patch(group,f,v,node),group);
  node.appendChild(ctl.node);
  if(f.description)node.appendChild(el(`<div class="fld-help">${esc(f.description)}</div>`));
  node.appendChild(el('<div class="fld-err"></div>'));

  const mark=()=>{const d=!eq(getIn(CFG.cur[group],f.path)??f.default,f.default);
    diff.classList.toggle('hidden',!d); reset.classList.toggle('hidden',!d);};
  mark(); node._mark=mark;
  reset.onclick=()=>patch(group,f,f.default,node);
  return node;
}
function widget(f,cur,onSave,group){
  // Anlık widget'lar (toggle/select/number/text) değişince KAYDEDER; çok satırlı
  // ve liste/sözlük editörleri açık "Kaydet" düğmesiyle kaydeder (her tuşta yazmasın).
  if(f.widget==='toggle'){
    const i=el(`<label class="row"><input type="checkbox" ${cur?'checked':''}> <span class="mut">${cur?'açık':'kapalı'}</span></label>`);
    const cb=i.querySelector('input'); cb.onchange=()=>{i.querySelector('span').textContent=cb.checked?'açık':'kapalı';onSave(cb.checked);};
    return {node:i};
  }
  if(f.widget==='select'){
    // options_from: seçenekler KARDEŞ bir dict alanın anahtarlarından gelir
    // (prompts.agent_system_active ← agent_system sürümleri). Şema söyler, UI uydurmaz.
    let opts=f.options||[];
    if(f.options_from)opts=Object.keys(getIn(CFG.cur[group],[f.options_from])||{});
    const s=el(`<select>${opts.map(o=>`<option ${String(o)===String(cur)?'selected':''}>${esc(o)}</option>`).join('')}</select>`);
    s.onchange=()=>onSave(s.value); return {node:s};
  }
  if(f.widget==='number'){
    const a=[f.min!=null?`min="${f.min}"`:'',f.max!=null?`max="${f.max}"`:'',f.step?`step="${f.step}"`:''].join(' ');
    const i=el(`<input type="number" ${a} value="${esc(cur)}">`);
    // Sunucu sınırı doğrular; tarayıcı sınırı yalnızca kolaylıktır (novalidate akış).
    i.onchange=()=>onSave(i.value===''?null:Number(i.value)); return {node:i};
  }
  if(f.widget==='text'){
    const i=el(`<input type="text" value="${esc(cur)}">`); i.onchange=()=>onSave(i.value); return {node:i};
  }
  if(f.widget==='textarea'||f.widget==='json'){
    const box=el('<div></div>');
    const isJson=f.widget==='json';
    const ta=el(`<textarea spellcheck="false">${esc(isJson?JSON.stringify(cur,null,2):cur)}</textarea>`);
    const b=el('<div class="row" style="margin-top:6px"><button>Kaydet</button></div>');
    b.querySelector('button').onclick=()=>{
      if(!isJson)return onSave(ta.value);
      try{onSave(JSON.parse(ta.value));}catch(e){alert('Geçersiz JSON: '+e.message);}
    };
    box.append(ta,b); return {node:box};
  }
  if(f.widget==='string_list'){
    const box=el('<div></div>'); const rows=el('<div></div>');
    const add=v=>{const r=el('<div class="listrow"><input spellcheck="false"><button title="sil">✕</button></div>');
      r.querySelector('input').value=v??''; r.querySelector('button').onclick=()=>r.remove(); rows.appendChild(r);};
    (Array.isArray(cur)?cur:[]).forEach(add);
    const b=el('<div class="row" style="margin-top:6px"><button>+ satır ekle</button><button class="pri">Kaydet</button></div>');
    const [addBtn,saveBtn]=b.querySelectorAll('button');
    addBtn.onclick=()=>add('');
    saveBtn.onclick=()=>onSave([...rows.querySelectorAll('input')].map(i=>i.value).filter(v=>v!==''));
    box.append(rows,b); return {node:box};
  }
  if(f.widget==='key_text'){   // dict[str,str] → anahtar başına çok satırlı metin
    const box=el('<div></div>'); const rows=el('<div></div>');
    const add=(k,v)=>{
      const r=el(`<div class="sect" style="padding:10px 12px"><div class="row" style="margin-bottom:6px">
        <input class="k mono" style="width:180px" placeholder="sürüm adı"><button class="lnk">sil</button></div></div>`);
      r.querySelector('.k').value=k??''; const ta=el('<textarea spellcheck="false"></textarea>'); ta.value=v??'';
      r.querySelector('button').onclick=()=>r.remove(); r.appendChild(ta); rows.appendChild(r);};
    Object.entries(cur&&typeof cur==='object'?cur:{}).forEach(([k,v])=>add(k,v));
    const b=el('<div class="row" style="margin-top:6px"><button>+ anahtar ekle</button><button class="pri">Kaydet</button></div>');
    const [addBtn,saveBtn]=b.querySelectorAll('button');
    addBtn.onclick=()=>add('','');
    saveBtn.onclick=()=>{const o={};rows.querySelectorAll('.sect').forEach(r=>{
      const k=r.querySelector('.k').value.trim(); if(k)o[k]=r.querySelector('textarea').value;}); onSave(o);};
    box.append(rows,b); return {node:box};
  }
  return {node:el(`<div class="mut">desteklenmeyen widget: ${esc(f.widget)}</div>`)};
}

// --- ALAN-BAZLI kayıt: tek parametre = tek PATCH (jsonb_set) ---
async function patch(group,f,value,node){
  clearErrors(node.closest('.card'));
  try{
    const r=await api('/api/admin/config/'+group,{method:'PATCH',body:JSON.stringify({path:f.path,value})});
    // Sunucunun DÖNDÜĞÜ (doğrulanmış/dönüştürülmüş) değeri yerele yaz — "16" değil 16.
    setIn(CFG.cur[group],f.path,r.value);
    flash(node,'kaydedildi · '+r.updated_by);
    // prompts.agent_system değişince aktif-sürüm dropdown'ının seçenekleri de değişir.
    if(f.widget==='key_text'||f.widget==='string_list'||f.widget==='textarea')renderConfig();
    else node._mark&&node._mark();
  }catch(e){ showErrors(node.closest('.card'),e); }
}
function setIn(o,p,v){let n=o;for(const k of p.slice(0,-1)){if(typeof n[k]!=='object'||n[k]==null)n[k]={};n=n[k];}n[p[p.length-1]]=v;}
function flash(node,text){
  const head=node.querySelector('.fld-head'); const b=el(`<span class="badge saved">✓ ${esc(text)}</span>`);
  head.appendChild(b); setTimeout(()=>b.remove(),3000);
}
function clearErrors(card){
  if(!card)return;
  card.querySelectorAll('.fld.bad').forEach(n=>{n.classList.remove('bad');n.querySelector('.fld-err').textContent='';});
  if(card._gerr){card._gerr.classList.remove('on');card._gerr.textContent='';}
}
// Hata ALANA iliştirilir (sunucu 'fields[].path' döner). Alan bulunamazsa grup başına.
function showErrors(card,e){
  clearErrors(card);
  const d=(e.body&&e.body.detail)||{}; const fields=d.fields||[];
  const rest=[];
  fields.forEach(fe=>{
    const n=card.querySelector(`.fld[data-f="${CSS.escape(fe.field)}"]`);
    if(n){n.classList.add('bad');n.querySelector('.fld-err').textContent='✕ '+fe.message;}
    else rest.push((fe.field?fe.field+': ':'')+fe.message);
  });
  if(!fields.length)rest.push(typeof d==='string'?d:(d.error||'doğrulama hatası'));
  if(rest.length&&card._gerr){card._gerr.textContent='✕ '+rest.join(' · ');card._gerr.classList.add('on');}
}
function msg(card,text,ok){const m=el(`<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`);card.appendChild(m);setTimeout(()=>m.remove(),8000);}

// --- 2) USERS ---
async function loadUsers(){
  const {users}=await api('/api/admin/users'); const c=$('#users');
  c.innerHTML=`<div class="card"><h3>Yeni kullanıcı</h3>
    <div class="row"><input id="nu_id" placeholder="user_id"><input id="nu_name" placeholder="ad">
    <input id="nu_sc" placeholder="scope'lar (virgül)" value="default"><label class="row"><input type="checkbox" id="nu_adm"> admin</label>
    <button class="pri" onclick="createUser()">Oluştur</button></div><div id="nu_out"></div></div>`;
  const t=el('<div class="card"><h3>Kullanıcılar</h3><table><thead><tr><th>user_id</th><th>ad</th><th>scope</th><th>admin</th><th>durum</th><th></th></tr></thead><tbody></tbody></table></div>');
  const tb=t.querySelector('tbody');
  users.forEach(u=>{
    const tr=el(`<tr><td class="mono">${u.user_id}</td><td>${u.display_name||''}</td>
      <td><input class="mono" style="width:130px" value="${u.allowed_doc_scopes.join(',')}"><button>set</button></td>
      <td>${u.is_admin?'✓':''}</td><td>${u.active?'<span class="pill s-COMPLETED">aktif</span>':'<span class="pill s-FAILED">pasif</span>'}</td>
      <td><button>${u.active?'deaktive':'aktive'}</button></td></tr>`);
    const [scIn,scBtn]=tr.querySelectorAll('td:nth-child(3) input, td:nth-child(3) button');
    scBtn.onclick=async()=>{await api(`/api/admin/users/${u.user_id}/scopes`,{method:'POST',body:JSON.stringify({scopes:scIn.value.split(',').map(s=>s.trim()).filter(Boolean)})});loadUsers();};
    tr.querySelector('td:last-child button').onclick=async()=>{try{await api(`/api/admin/users/${u.user_id}/active`,{method:'POST',body:JSON.stringify({active:!u.active})});loadUsers();}catch(e){alert((e.body&&e.body.detail)||'hata');}};
    tb.appendChild(tr);
  });
  c.appendChild(t);
}
async function createUser(){
  const id=$('#nu_id').value.trim(); if(!id)return;
  try{const r=await api('/api/admin/users',{method:'POST',body:JSON.stringify({user_id:id,display_name:$('#nu_name').value.trim()||null,allowed_doc_scopes:$('#nu_sc').value.split(',').map(s=>s.trim()).filter(Boolean),is_admin:$('#nu_adm').checked})});
    $('#nu_out').innerHTML=`<div class="msg ok">Oluşturuldu. Token (TEK KEZ gösterilir):</div><div class="tok">${r.token}</div>`;loadUsers();}
  catch(e){$('#nu_out').innerHTML=`<div class="msg err">Hata: ${(e.body&&e.body.detail)||e.status}</div>`;}
}

// --- 3) DOKÜMAN & QC ---
async function loadDocs(){
  const {files}=await api('/api/admin/files'); const c=$('#docs');
  c.innerHTML='';
  const ft=el('<div class="card"><h3>Dokümanlar ('+files.length+')</h3><table><thead><tr><th>dosya</th><th>tip</th><th>scope</th><th>durum</th><th>kalite</th><th>güncelleme</th></tr></thead><tbody></tbody></table></div>');
  const ftb=ft.querySelector('tbody');
  files.forEach(f=>ftb.appendChild(el(`<tr><td>${f.file_name}</td><td>${f.file_type}</td><td class="mono">${f.doc_scope}</td>
    <td class="s-${f.status}">${f.status}${f.fail_reason?' <span class="mut">('+f.fail_reason.slice(0,30)+')</span>':''}</td>
    <td>${f.quality_score??'—'}</td><td class="mut">${(f.updated_at||'').slice(0,19)}</td></tr>`)));
  c.appendChild(ft);
  const qc=el('<div class="card"><h3>QC bulguları</h3><div class="row" style="margin-bottom:8px">Tip: <select id="qc_ft"><option value="">hepsi</option></select> <label class="row"><input type="checkbox" id="qc_open"> yalnız açık</label> <span id="qc_cnt" class="mut"></span></div><table><thead><tr><th>dosya</th><th>bulgu</th><th>detay</th><th>durum</th><th></th></tr></thead><tbody></tbody></table></div>');
  c.appendChild(qc);
  ['empty_chunk','duplicate_chunk','too_short','too_long','parse_failed','embed_failed','injection_suspect','low_coverage','low_retention','no_cleaning_effect','chunk_truncation_high','embed_anomaly'].forEach(t=>qc.querySelector('#qc_ft').appendChild(el(`<option>${t}</option>`)));
  qc.querySelector('#qc_ft').onchange=loadQc; qc.querySelector('#qc_open').onchange=loadQc;
  await loadQc();
}
async function loadQc(){
  const ft=$('#qc_ft').value, open=$('#qc_open').checked;
  const {findings,counts}=await api(`/api/admin/qc?only_open=${open}${ft?'&finding_type='+ft:''}`);
  $('#qc_cnt').textContent=`açık ${counts.open} · çözüldü ${counts.resolved} · toplam ${counts.total}`;
  const tb=$('#docs').querySelector('.card:last-child tbody'); tb.innerHTML='';
  findings.forEach(f=>{
    const tr=el(`<tr><td>${f.file_name}</td><td class="pill">${f.finding}</td><td class="mut">${(f.detail||'').slice(0,60)}</td>
      <td>${f.resolved?'<span class="s-COMPLETED">çözüldü</span>':'<span class="s-FAILED">açık</span>'}</td>
      <td><button>${f.resolved?'aç':'çözüldü işaretle'}</button></td></tr>`);
    tr.querySelector('button').onclick=async()=>{await api(`/api/admin/qc/${f.finding_id}/resolve`,{method:'POST',body:JSON.stringify({resolved:!f.resolved})});loadQc();};
    tb.appendChild(tr);
  });
}
if(tokv())load(); else gate(401);
</script>
