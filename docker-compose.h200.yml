# ragintel-api — H200 dağıtımı (M-10/0).
#
# ÖNEMLİ MİMARİ DEĞİŞİKLİK: LLM artık DOĞRUDAN Ollama'ya (:11434) gidiyor,
# Open WebUI (/ollama/v1) ÜZERİNDEN DEĞİL.
#   Gerekçe 1 (deploy): API H200'ün ÜZERİNDE koşacak → localhost, ağ atlaması yok.
#   Gerekçe 2 (tanı)  : M-9.1'de bulunan "500 failed to parse JSON: invalid
#     character 'H'" hatası submit_answer tool-call'unda WebUI katmanında ortaya
#     çıkıyordu. Doğrudan Ollama, o katmanı devreden çıkarır → suçlu WebUI ise
#     taşınma sorunu ÇÖZER; hâlâ kırıksa suçlu Ollama/model (bkz.
#     scripts/ollama_dogrudan_smoke.py — kayıtlı istek ×20).
#
# network_mode: host → Ollama (11434) localhost'tan erişilir; DB ise ağdaki ayrı
# bir sunucuda — adresi `.env.h200`'den gelir (bkz. `environment:` üstündeki not).

services:
  ragintel-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # deploy.sh bunu `git rev-parse --short HEAD` ile doldurur → /api/health
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ragintel-api:${GIT_SHA:-latest}
    container_name: ragintel-api
    restart: unless-stopped

    # H200 üzerinde koşar: Ollama/TEI localhost, port map'e gerek yok.
    network_mode: host

    # Sırlar + MAKİNEYE ÖZGÜ bağlantı bilgisi (DB adresi/parolası, Langfuse) dosyadan;
    # repoya GİRMEZ. Bootstrap ayarları bunu os.environ üzerinden okur — imajda `.env`
    # yoktur ve olmamalıdır (bkz. settings.DotenvFirstSettings).
    env_file:
      - .env.h200

    # DİKKAT — buraya ORTAMA BAĞLI değer YAZILMAZ: compose'da `environment:` her
    # zaman `env_file:`'ı EZER. Burası yalnızca MİMARİ/DAĞITIM SABİTLERİ içindir
    # (host-network + doğrudan Ollama kararı).
    #
    # Bir zamanlar burada `RAGINTEL_DB_HOST: <bir adres>` yazıyordu. Kaldırıldı,
    # çünkü DB adresi NEREDEN BAKTIĞINA bağlı: dev makinesi ile H200 farklı
    # segmentte ve AYNI veritabanını farklı adresten görüyor (bkz.
    # docs/RAG_v2_Proje_Dokumani.md — dev↔H200 segment/firewall notu). Repoda tek
    # bir değer sabitlemek imkânsız; sabitlense `.env.h200`'deki doğru değeri
    # SESSİZCE ezerdi. Bağlantı bilgisi makinenin bilgisidir → `.env.h200`.
    environment:
      # --- LLM: DOĞRUDAN Ollama (Open WebUI DEĞİL) ---
      # litellm `openai` provider'ı OpenAI-compat uç ister → Ollama /v1 sunar.
      RAGINTEL_LLM_PROVIDER: openai
      RAGINTEL_LLM_API_BASE: http://localhost:11434/v1
      # Ollama auth İSTEMEZ. Ama openai SDK boş anahtarı reddedebilir → zararsız
      # yer tutucu. (gateway: api_key varsa Bearer ekler; Ollama görmezden gelir.)
      # Smoke listesinde doğrulanır: boş bırakılabiliyorsa bu satır silinir.
      RAGINTEL_LLM_API_KEY: ollama-local
      # Model adı DB-OTORİTER (app_config `agent.model`); .env EZEMEZ → BOŞ.
      RAGINTEL_LLM_MODEL: ""
      RAGINTEL_LLM_REQUEST_TIMEOUT: "300"

      # --- Embedding: DOĞRUDAN Ollama ---
      # Damga (`bge-m3@ollama`) DEĞİŞMEZ → korpustaki 1478 vektörle uyum korunur.
      RAGINTEL_OLLAMA_BASE_URL: http://localhost:11434
      RAGINTEL_OLLAMA_MODEL: bge-m3
      # Auth'suz uçta Bearer GÖNDERİLMEZ (embedder: anahtar yoksa header yok).
      RAGINTEL_OLLAMA_API_KEY: ""

      # --- TEI rerank: KAPALI (bilinçli) ---
      # DB-otoriter `retrieval.rerank_backend = "passthrough"` → TEI HİÇ ÇAĞRILMIYOR.
      # URL'i yine de vermek zararsız DEĞİL: kod, URL doluysa health check atar
      # (runtime.health), TEI ayakta olmadığı için "tei" düşer ve sistem hiçbir
      # işlev kaybı olmadan sürekli "degraded" görünür — yanlış alarm. URL boşken
      # health "disabled" der ve degrade ETMEZ (M-4: yapılandırılmamış opsiyonel
      # bileşen, arızalı bileşen değildir).
      #
      # TEI'ye geçilecekse: TEI'yi ayağa kaldırın, aşağıdaki satırı açın ve
      # `retrieval.rerank_backend`'i DB'den 'tei' yapın (mimari karar — ikisi
      # birlikte değişir). Yalnızca backend'i 'tei' yapıp URL'i açmazsanız
      # `require_rerank_url()` AÇIK hata verir; sessiz bozulma yok.
      # RAGINTEL_TEI_RERANK_URL: http://localhost:8085

      # --- DB: BURADA DEĞİL ---
      # RAGINTEL_DB_HOST/PORT/NAME/SCHEMA/USER/PASSWORD tamamı `.env.h200`'dedir.
      # Gerekçe: DB adresi ORTAMA göre değişir (aynı DB, dev makinesinden başka
      # adres, H200'den başka) ve parolayla aynı dosyada durması doğaldır.
      # Şablon: docs/M10_H200_Kurulum.md §2 · eksikse deploy.sh açılıştan ÖNCE durur.

    healthcheck:
      # /api/health: db + ollama + tei + redis + warmup. Warming'de de 200 döner (status
      # gövdede) → healthcheck'i warm-up'a esir etmemek için gövdeye bakmıyoruz.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s   # ilk warm-up (tokenizer + embedder) için pay
      retries: 3

  # ---------------------------------------------------------------------------
  # M-10/0 EK — oturum-token cache'i (Redis). OPSİYONEL HIZLANDIRICI, DB kaynak-otoriter:
  # uygulama Redis'i yalnız cache olarak kullanır; erişilemezse DB'ye düşer (fail-safe).
  # Bu yüzden ragintel-api'de `depends_on: redis` YOK — app Redis'e ESİR değildir
  # (Redis çökse de kimlik/istek yolu çalışmaya devam eder, yalnız her istekte DB'ye gider).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: ragintel-redis
    restart: unless-stopped

    # app da host-network → Redis'e localhost:6380'den erişir (RAGINTEL_REDIS_URL).
    # PORT 6380 (6379 DEĞİL): H200'de 6379'u Langfuse'un kendi redis'i (langfuse-redis-1)
    # host'a map'lemiş durumda (ölçüldü 2026-07-19; Langfuse dokümanı "host'a açılmaz"
    # dese de pratikte açık). Aynı porta iki redis bind edemez → bizimki 6380'de yaşar,
    # Langfuse 6379'da kalır. RAGINTEL_REDIS_URL de .env.h200'de :6380 olmalı.
    network_mode: host

    # Parola (requirepass) + app'in RAGINTEL_REDIS_URL'i .env.h200'dedir (repoda YOK).
    # DİKKAT: compose `${...}` interpolasyonu .env.h200'ü GÖRMEZ (deploy.sh `--env-file`
    # kullanmıyor — bilinçli). O yüzden parolayı KONTEYNER ENV'ine `env_file` ile veriyoruz
    # ve `requirepass`'i konteyner-İÇİ shell expansion (`$$` → literal `$`) ile okuyoruz:
    # parola ne compose'a, ne shell'e, ne repoya, ne de `docker inspect` argüman listesine
    # LİTERAL olarak girer.
    env_file:
      - .env.h200

    # Bu bir CACHE: `maxmemory 4gb` + `allkeys-lru` → bellek dolunca en eski oturumlar
    # düşürülür (miss → DB fallback, işlev kaybı YOK). `appendonly no` + `save ""` → kalıcılık
    # YOK (cache; AOF/RDB fork-stall'ı + disk maliyeti gereksiz). `--bind 127.0.0.1` →
    # host-network'te yalnız loopback (dışarıya açılmaz).
    command: >
      sh -c 'exec redis-server
      --requirepass "$$RAGINTEL_REDIS_PASSWORD"
      --bind 127.0.0.1
      --port 6380
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""'

    healthcheck:
      # requirepass açıkken parolasız `ping` NOAUTH döner → auth'lu ping. Parola konteyner
      # env'inden ($RAGINTEL_REDIS_PASSWORD); healthcheck argümanında literal parola yok.
      # -p 6380: sunucu bu portta (Langfuse 6379'da olduğu için).
      test: ["CMD-SHELL", "redis-cli -p 6380 -a \"$$RAGINTEL_REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
